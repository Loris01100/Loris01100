<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1c1426"/>
      <stop offset="60%" stop-color="#0d0a12"/>
      <stop offset="100%" stop-color="#050407"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3dc9a"/>
      <stop offset="55%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#7a5a1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b1e2d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b1e2d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="420" ry="140" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Sigil -->
  <g transform="translate(600 150)" fill="none" stroke="#c9a24a" stroke-opacity="0.18">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <circle r="128" stroke-width="1"/>
      <circle r="118" stroke-width="0.6" stroke-dasharray="2 6"/>
      <polygon points="0,-118 102,59 -102,59" stroke-width="0.8"/>
      <polygon points="0,118 102,-59 -102,-59" stroke-width="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/>
      <circle r="140" stroke-width="0.6" stroke-dasharray="14 10"/>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#c9a24a" stroke-opacity="0.55">
    <rect x="16" y="16" width="1168" height="268" stroke-width="1"/>
    <rect x="24" y="24" width="1152" height="252" stroke-width="0.5" stroke-opacity="0.35"/>
  </g>
  <g fill="#c9a24a" fill-opacity="0.8">
    <path d="M16 16 l14 0 l-14 14z"/><path d="M1184 16 l-14 0 l14 14z"/>
    <path d="M16 284 l14 0 l-14 -14z"/><path d="M1184 284 l-14 0 l14 -14z"/>
  </g>

  <!-- Runes -->
  <g font-family="'Segoe UI Historic','Noto Sans Runic',serif" font-size="18" fill="#c9a24a" fill-opacity="0.35" letter-spacing="10">
    <text x="600" y="56" text-anchor="middle">ᛚ ᛟ ᚱ ᛁ ᛊ · ᚦ ᛖ · ᚲ ᛟ ᛞ ᛖ ᚱ</text>
    <text x="600" y="262" text-anchor="middle">ᚱ ᚢ ᛊ ᛏ · ᛉ ᛁ ᚷ · ᚾ ᛁ ᛉ ᛟ ᛊ</text>
  </g>

  <!-- Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif" font-size="78" font-weight="700" letter-spacing="14" fill="url(#gold)">LORIS01100</text>
  <text x="600" y="160" text-anchor="middle" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif" font-size="78" font-weight="700" letter-spacing="14" fill="none" stroke="#f3dc9a" stroke-opacity="0.25" stroke-width="1" filter="url(#soft)"/>
  <text x="600" y="205" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="20" fill="#d8cbb0" fill-opacity="0.85" letter-spacing="3">Forger of engines · Seeker of NixOS · Wanderer of the terminal</text>

  <!-- Embers -->
  <g fill="#e0683a">
    <circle cx="180" cy="290" r="2"><animate attributeName="cy" values="290;20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="290" r="1.5"><animate attributeName="cy" values="290;40" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="290" r="1.2"><animate attributeName="cy" values="290;30" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="290" r="1.8"><animate attributeName="cy" values="290;25" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="290" r="1.3"><animate attributeName="cy" values="290;50" dur="7.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="290" r="2"><animate attributeName="cy" values="290;30" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="290" r="1"><animate attributeName="cy" values="290;60" dur="5.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="5.5s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
