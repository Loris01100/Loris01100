<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0b16"/><stop offset="1" stop-color="#060408"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc9a"/><stop offset="1" stop-color="#a07a2c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="8" fill="url(#bg)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="480" height="26" rx="8" fill="#1a1422"/>
  <rect x="0" y="16" width="480" height="10" fill="#1a1422"/>
  <circle cx="18" cy="13" r="5" fill="#8b1e2d"/>
  <circle cx="36" cy="13" r="5" fill="#c9a24a"/>
  <circle cx="54" cy="13" r="5" fill="#4b2a6b"/>
  <text x="240" y="17" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="11" fill="#d8cbb0" fill-opacity="0.5">~/grimoire — cmdboard</text>

  <text x="32" y="72" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif" font-size="32" font-weight="700" letter-spacing="5" fill="url(#gold)">CMDBOARD</text>
  <text x="32" y="94" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#d8cbb0" fill-opacity="0.8">Every incantation, one keystroke away</text>

  <g font-family="'Cascadia Code',Consolas,monospace" font-size="12">
    <text x="32" y="134" fill="#c9a24a">┌─ spells ───────────────────────────┐</text>
    <text x="32" y="154" fill="#e0683a">▸</text><text x="46" y="154" fill="#d8cbb0">nix build .#default</text><text x="300" y="154" fill="#6b5a7a">[b]</text>
    <text x="46" y="172" fill="#d8cbb0" fill-opacity="0.7">cargo run --release</text><text x="300" y="172" fill="#6b5a7a">[r]</text>
    <text x="46" y="190" fill="#d8cbb0" fill-opacity="0.7">git push origin main</text><text x="300" y="190" fill="#6b5a7a">[p]</text>
    <text x="32" y="210" fill="#c9a24a">└────────────────────────────────────┘</text>
    <text x="32" y="242" fill="#e0683a">❯ <tspan fill="#d8cbb0">summon</tspan><tspan fill="#d8cbb0">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- sigil -->
  <g transform="translate(410 90)" fill="none" stroke="#c9a24a" stroke-opacity="0.35">
    <circle r="34"/>
    <polygon points="0,-30 26,15 -26,15"/>
    <polygon points="0,30 26,-15 -26,-15"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" additive="sum"/>
  </g>

  <rect x="0.5" y="0.5" width="479" height="269" rx="8" fill="none" stroke="#c9a24a" stroke-opacity="0.5"/>
</svg>
