<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0d14"/>
      <stop offset="0.6" stop-color="#140a10"/>
      <stop offset="1" stop-color="#07050a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc9a"/><stop offset="1" stop-color="#a07a2c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0683a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b1e2d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" rx="8" fill="url(#sky)"/>
  <circle cx="240" cy="150" r="110" fill="url(#sun)">
    <animate attributeName="r" values="100;115;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Colosseum arches -->
  <g fill="#07050a">
    <path d="M0 270 V170 H480 V270Z"/>
  </g>
  <g fill="#1a0f14" stroke="#c9a24a" stroke-opacity="0.25">
    <path d="M0 175 H480 V182 H0Z"/>
  </g>
  <g fill="#2a0d14" fill-opacity="0.9">
    <path d="M20 270 V215 a18 18 0 0 1 36 0 V270Z"/>
    <path d="M76 270 V215 a18 18 0 0 1 36 0 V270Z"/>
    <path d="M132 270 V215 a18 18 0 0 1 36 0 V270Z"/>
    <path d="M312 270 V215 a18 18 0 0 1 36 0 V270Z"/>
    <path d="M368 270 V215 a18 18 0 0 1 36 0 V270Z"/>
    <path d="M424 270 V215 a18 18 0 0 1 36 0 V270Z"/>
  </g>

  <!-- Crossed swords -->
  <g transform="translate(240 142) scale(0.75)" stroke-linecap="round">
    <g transform="rotate(35)">
      <rect x="-3" y="-70" width="6" height="90" fill="#d8cbb0"/>
      <path d="M-3 -70 L0 -80 L3 -70Z" fill="#d8cbb0"/>
      <rect x="-16" y="20" width="32" height="5" fill="url(#gold)"/>
      <rect x="-2.5" y="25" width="5" height="18" fill="#5a3a20"/>
      <circle cy="46" r="4" fill="url(#gold)"/>
    </g>
    <g transform="rotate(-35)">
      <rect x="-3" y="-70" width="6" height="90" fill="#d8cbb0"/>
      <path d="M-3 -70 L0 -80 L3 -70Z" fill="#d8cbb0"/>
      <rect x="-16" y="20" width="32" height="5" fill="url(#gold)"/>
      <rect x="-2.5" y="25" width="5" height="18" fill="#5a3a20"/>
      <circle cy="46" r="4" fill="url(#gold)"/>
    </g>
  </g>

  <text x="240" y="44" text-anchor="middle" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif" font-size="34" font-weight="700" letter-spacing="8" fill="url(#gold)">LANISTA</text>
  <text x="240" y="64" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#d8cbb0" fill-opacity="0.8">Gladiators forged in a homemade Rust engine</text>
  <text x="240" y="205" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c9a24a" fill-opacity="0.7" letter-spacing="4">AVE · MORITURI · TE · SALUTANT</text>

  <rect x="0.5" y="0.5" width="479" height="269" rx="8" fill="none" stroke="#c9a24a" stroke-opacity="0.5"/>
</svg>
