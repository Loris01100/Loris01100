<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f1f"/><stop offset="1" stop-color="#07050a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc9a"/><stop offset="1" stop-color="#a07a2c"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7a41d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f7a41d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" rx="8" fill="url(#bg)"/>

  <!-- Left: text -->
  <text x="36" y="70" font-family="'Cinzel','Trajan Pro','Times New Roman',Georgia,serif" font-size="34" font-weight="700" letter-spacing="6" fill="url(#gold)">ZIGBOY</text>
  <text x="36" y="94" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#d8cbb0" fill-opacity="0.85">A Game Boy reborn, written in Zig</text>
  <g font-family="'Cascadia Code',Consolas,monospace" font-size="12" fill="#d8cbb0" fill-opacity="0.65">
    <text x="36" y="134"><tspan fill="#f7a41d">›</tspan> CPU   · SM83 core</text>
    <text x="36" y="154"><tspan fill="#f7a41d">›</tspan> PPU   · 160×144 scanlines</text>
    <text x="36" y="174"><tspan fill="#f7a41d">›</tspan> MMU   · cartridge &amp; banks</text>
    <text x="36" y="194"><tspan fill="#f7a41d">›</tspan> APU   · four haunted voices</text>
  </g>
  <text x="36" y="238" font-family="Georgia,serif" font-size="10" fill="#c9a24a" fill-opacity="0.6" letter-spacing="3">EMULATIO · ANTIQUA · MACHINA</text>

  <!-- Right: handheld -->
  <circle cx="370" cy="135" r="110" fill="url(#aura)"/>
  <g transform="translate(310 35)">
    <rect width="120" height="200" rx="10" ry="10" fill="#1d1824" stroke="#c9a24a" stroke-opacity="0.6"/>
    <rect x="12" y="14" width="96" height="78" rx="4" fill="#0b0a10" stroke="#3a2f45"/>
    <rect x="22" y="22" width="76" height="62" fill="#1e2a14"/>
    <!-- pixel skull on screen -->
    <g fill="#9bbc0f">
      <rect x="48" y="34" width="24" height="4"/>
      <rect x="44" y="38" width="32" height="16"/>
      <rect x="48" y="54" width="24" height="8"/>
      <rect x="52" y="62" width="4" height="4"/><rect x="60" y="62" width="4" height="4"/><rect x="68" y="62" width="0" height="4"/>
      <animate attributeName="opacity" values="1;0.6;1;1;0.8;1" dur="2.5s" repeatCount="indefinite"/>
    </g>
    <g fill="#1e2a14">
      <rect x="49" y="42" width="8" height="8"/><rect x="63" y="42" width="8" height="8"/>
      <rect x="58" y="52" width="4" height="4"/>
    </g>
    <!-- d-pad & buttons -->
    <g fill="#3a2f45">
      <rect x="22" y="128" width="30" height="10" rx="2"/>
      <rect x="32" y="118" width="10" height="30" rx="2"/>
    </g>
    <circle cx="96" cy="124" r="8" fill="#8b1e2d"/>
    <circle cx="78" cy="138" r="8" fill="#8b1e2d"/>
    <g fill="#3a2f45"><rect x="38" y="168" width="18" height="5" rx="2.5"/><rect x="62" y="168" width="18" height="5" rx="2.5"/></g>
  </g>

  <rect x="0.5" y="0.5" width="479" height="269" rx="8" fill="none" stroke="#c9a24a" stroke-opacity="0.5"/>
</svg>
